# pytest.ini  (colócalo en la raíz del proyecto, junto a manage.py)
[pytest]
# ── Configuración de pytest-django ─────────────────────────────────────────
DJANGO_SETTINGS_MODULE = config.settings

# ── Directorios de tests ────────────────────────────────────────────────────
testpaths =
    tests

# ── Marcas personalizadas ───────────────────────────────────────────────────
markers =
    e2e: Tests end-to-end con Playwright (lentos, requieren live_server)
    unit: Tests unitarios rápidos

# ── Opciones por defecto ────────────────────────────────────────────────────
addopts =
    --strict-markers
    -ra

# ── Playwright ──────────────────────────────────────────────────────────────
# Descomenta para cambiar el navegador por defecto:
# playwright_browser_name = chromium   # o firefox, webkit
